repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
        fail_fast: true

  - repo: local
    hooks:
      - id: ruff
        name: Ruff checks
        entry: python -m ruff check
        language: system
        files: '\.(py|ipynb)$'

      - id: pytest
        name: Tests with coverage
        entry: python -m pytest --cov=app --cov=fairness --cov=healthequity --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        
